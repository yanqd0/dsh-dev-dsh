# ============================================================================
# dsh-dev-dsh —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 本文件是插件的挂载声明：package.json 的 `dsh.bundle.patch` 指向它，dsh 在
# `dsh plugin --profile <p> add` 之后按已装状态把本包写入 `dsh.profile.bundles`，
# 因此**无需手改 profile 的 cordis.patch.yml**。
#
#   dsh plugin --profile web add @yanqd0/dsh-dev-dsh
#
# 三条硬约束（踩过的坑，改动前先读）：
# 1. 新条目必须用 `insert:` 列表包裹——裸 `- id/name` 行是配置*覆盖*语义，
#    会报 `patch: entry "dsh-dev-dsh" not found`。
# 2. `config` 必须显式给（空对象即可）：插件导出的是 zod object Config，
#    缺省 config 的校验会失败（`invalid config: - Required (at )`）。
# 3. 与 profile 里手写的同 id 条目并存**不会报错**：0.1.7-rc.2 的 Loader 对同 id
#    是 last-wins 的静默复用/替换（entry 被 move/update），profile 照常启动，
#    但后写入者生效。旧说法 `duplicate loader entry id` 在 0.1.7-rc.2 已无此抛错
#    （见 issue #16；证据是 vendor/loader/src/config/group.ts 的 create()/ensureId()）；
#    因此两者仍只能留其一，否则配置被静默覆盖、更难排查。
#
# 本文件必须列入 package.json 的 `files` 随包发布：dsh 从已安装包的目录读它。
#
# 试验性子模块（src/uv/，宿主 `uv` 工具）默认**关闭**：它让 uv 在插件进程内执行、
# 不受会话文件沙箱约束，属于改变安全姿态的选择，不能随包默认生效。开启方式是在
# profile 层加一条覆盖行（profile patch 在 bundle 层之后生效，last-wins；同 id 并存
# 不报错，见第 3 条），改完需重启 harness：
#
#   # ~/.dsh/profiles/<profile>/cordis.patch.yml
#   - id: dsh-dev-dsh
#     config:
#       uv:
#         enabled: true
#         # entry: ~/.local/bin/uv
#         # timeoutMs: 600000
#         # passEnv: [UV_INDEX_URL]
#
# 设计、被否决的方案与已知限制见 notes/uv.md。
# ============================================================================

- insert:
    - id: dsh-dev-dsh
      name: '@yanqd0/dsh-dev-dsh'
      config: {}
